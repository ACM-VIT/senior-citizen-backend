services:
  kratos:
    image: oryd/kratos:v1.1.0
    ports:
      - "4433:4433"
      - "4434:4434"
    env_file:
      - .env
    environment:
      - DSN=${KRATOS_DSN}
      - LOG_LEVEL=${KRATOS_LOG_LEVEL}
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - ./config:/etc/config/kratos
    networks:
      - intranet

  kratos-migrate:
    image: oryd/kratos:v1.1.0
    env_file:
      - .env
    environment:
      - DSN=postgres://kratos:secret@kratos-postgres:5432/kratos?sslmode=disable
    command: migrate sql -e --yes -c /etc/config/kratos/kratos.yml
    volumes:
      - ./config:/etc/config/kratos
    networks:
      - intranet
    depends_on:
      - kratos-postgres
    restart: on-failure

  hydra:
    image: oryd/hydra:v2.2.0
    ports:
      - "4444:4444"
      - "4445:4445"
      - "5555:5555"
    env_file:
      - .env
    environment:
      - DSN=${HYDRA_DSN}
    command: serve -c /etc/config/hydra/hydra.yml all --dev
    volumes:
      - ./config:/etc/config/hydra
    networks:
      - intranet

  hydra-migrate:
    image: oryd/hydra:v2.2.0
    command: migrate sql -e --yes
    environment:
      - DSN=${HYDRA_DSN}
    networks:
      - intranet
    depends_on:
      - hydra-postgres
    restart: on-failure

  kratos-selfservice-ui-node:
    image: oryd/kratos-selfservice-ui-node:v1.1.0
    ports:
      - "4455:4455"
    env_file:
      - .env
    environment:
      - PORT=4455
      - HYDRA_ADMIN_URL=http://hydra:4445
      - KRATOS_PUBLIC_URL=http://kratos:4433
      - KRATOS_BROWSER_URL=http://127.0.0.1:4433
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME}
      - CSRF_COOKIE_SECRET=${CSRF_COOKIE_SECRET}
      - DANGEROUSLY_DISABLE_SECURE_CSRF_COOKIES=true
    networks:
      - intranet
    restart: on-failure

  cockroach:
    image: cockroachdb/cockroach:v23.1.13
    command: start-single-node --insecure --store=/cockroach/cockroach-data --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080
    ports:
      - "26257:26257"
      - "8080:8080"
    networks:
      - intranet
    volumes:
      - cockroach-data:/cockroach/cockroach-data

  cockroach-init:
    image: cockroachdb/cockroach:v23.1.13
    depends_on:
      - cockroach
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 2; cockroach sql --insecure --host=cockroach:26257 -e 'CREATE DATABASE IF NOT EXISTS senior_citizen;'"]
    networks:
      - intranet
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://root@cockroach:26257/senior_citizen?sslmode=disable}
      - HYDRA_ADMIN_URL=${HYDRA_ADMIN_URL:-http://hydra:4445}
      - KRATOS_ADMIN_URL=${KRATOS_ADMIN_URL:-http://kratos:4434}
      - SHOULD_MIGRATE=${SHOULD_MIGRATE:-true}
    networks:
      - intranet
    depends_on:
      - cockroach
      - cockroach-init

  kratos-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kratos
    ports:
      - "5432:5432"
    networks:
      - intranet
    volumes:
      - kratos-db:/var/lib/postgresql/data

  hydra-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: hydra
    ports:
      - "5433:5432"
    networks:
      - intranet
    volumes:
      - hydra-db:/var/lib/postgresql/data

networks:
  intranet:
    driver: bridge
volumes:
  kratos-db:
  hydra-db:
  cockroach-data:
