services:
  kratos:
    image: oryd/kratos:v1.1.0
    ports:
      - "4433:4433"
      - "4434:4434"
    env_file:
      - .env
    environment:
      - DSN=${KRATOS_DSN}
      - LOG_LEVEL=${KRATOS_LOG_LEVEL}
      - SECRETS_COOKIE=${KRATOS_COOKIE_SECRET}
      - SECRETS_CIPHER=${KRATOS_CIPHER_SECRET}
    command: serve -c /etc/config/kratos/kratos.yml
    volumes:
      - ./config:/etc/config/kratos
    networks:
      - intranet

  kratos-migrate:
    image: oryd/kratos:v1.1.0
    env_file:
      - .env
    environment:
      - DSN=${KRATOS_DSN}
    command: migrate sql -e --yes -c /etc/config/kratos/kratos.yml
    volumes:
      - ./config:/etc/config/kratos
    networks:
      - intranet
    depends_on:
      - kratos-postgres
    restart: on-failure

  hydra:
    image: oryd/hydra:v2.2.0
    ports:
      - "4444:4444"
      - "4445:4445"
      - "5555:5555"
    env_file:
      - .env
    environment:
      - DSN=${HYDRA_DSN}
      - SECRETS_SYSTEM=${HYDRA_SYSTEM_SECRET}
      - OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT=${HYDRA_OIDC_SALT}
    command: serve -c /etc/config/hydra/hydra.yml all
    volumes:
      - ./config:/etc/config/hydra
    networks:
      - intranet
    depends_on:
      hydra-postgres:
        condition: service_healthy
      hydra-migrate:
        condition: service_completed_successfully

  hydra-migrate:
    image: oryd/hydra:v2.2.0
    env_file:
      - .env
    environment:
      - DSN=${HYDRA_DSN}
    command: migrate sql -e --yes
    networks:
      - intranet
    depends_on:
      - hydra-postgres
    restart: on-failure

  cockroach-cert:
    image: cockroachdb/cockroach:v23.1.13
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -e;
        if [ ! -f /certs/ca.crt ]; then
          cockroach cert create-ca --certs-dir=/certs --ca-key=/certs/ca.key;
          cockroach cert create-node cockroach localhost 127.0.0.1 --certs-dir=/certs --ca-key=/certs/ca.key;
          cockroach cert create-client root --certs-dir=/certs --ca-key=/certs/ca.key;
          chmod 600 /certs/*.key;
          chmod 644 /certs/*.crt;
        fi
    volumes:
      - cockroach-certs:/certs
    networks:
      - intranet
    restart: "no"

  cockroach:
    image: cockroachdb/cockroach:v23.1.13
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while [ ! -f /certs/ca.crt ]; do
          sleep 1;
        done;
        cockroach start --certs-dir=/certs --store=/cockroach/cockroach-data --listen-addr=0.0.0.0:26257 --advertise-addr=cockroach:26257 --http-addr=0.0.0.0:8085 --join=cockroach:26257
    ports:
      - "26257:26257"
      - "8085:8085"
    networks:
      - intranet
    volumes:
      - cockroach-data:/cockroach/cockroach-data
      - cockroach-certs:/certs
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--certs-dir=/certs", "--host=localhost:26257", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      - cockroach-cert

  cockroach-init:
    image: cockroachdb/cockroach:v23.1.13
    depends_on:
      - cockroach-cert
      - cockroach
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -e;
        for i in $(seq 1 30); do
          if cockroach sql --certs-dir=/certs --host=cockroach:26257 -e 'SELECT 1' 2>/dev/null; then
            echo "Cluster is already initialized and ready";
            break;
          fi;
          cockroach init --certs-dir=/certs --host=cockroach:26257 2>&1 | grep -v "already been initialized" || true;
          sleep 2;
        done;
        cockroach sql --certs-dir=/certs --host=cockroach:26257 -e 'CREATE DATABASE IF NOT EXISTS senior_citizen;'
    volumes:
      - cockroach-certs:/certs
    networks:
      - intranet
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PUBLIC_URL=${PUBLIC_URL}
      - HYDRA_ADMIN_URL=${HYDRA_ADMIN_URL}
      - HYDRA_INTROSPECTION_CLIENT_ID=${HYDRA_INTROSPECTION_CLIENT_ID}
      - HYDRA_INTROSPECTION_CLIENT_SECRET=${HYDRA_INTROSPECTION_CLIENT_SECRET}
      - KRATOS_ADMIN_URL=${KRATOS_ADMIN_URL}
      - KRATOS_PUBLIC_URL=${KRATOS_PUBLIC_URL}
      - KRATOS_BROWSER_URL=${KRATOS_BROWSER_URL}
      - KRATOS_UI_URL=${KRATOS_UI_URL}
      - SHOULD_MIGRATE=${SHOULD_MIGRATE}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME}
      - CSRF_COOKIE_SECRET=${CSRF_COOKIE_SECRET}
    networks:
      - intranet
    volumes:
      - cockroach-certs:/certs
    depends_on:
      cockroach:
        condition: service_healthy
      cockroach-init:
        condition: service_completed_successfully

  kratos-postgres:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: ${KRATOS_DB_PASSWORD}
      POSTGRES_DB: kratos
    ports:
      - "5432:5432"
    networks:
      - intranet
    volumes:
      - kratos-db:/var/lib/postgresql/data

  hydra-postgres:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: ${HYDRA_DB_PASSWORD}
      POSTGRES_DB: hydra
    ports:
      - "5433:5432"
    networks:
      - intranet
    volumes:
      - hydra-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  intranet:
    driver: bridge
volumes:
  kratos-db:
  hydra-db:
  cockroach-data:
  cockroach-certs:
