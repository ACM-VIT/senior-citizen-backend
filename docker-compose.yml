services:
  kratos:
    image: oryd/kratos:v1.1.0
    ports:
      - "4433:4433"
      - "4434:4434"
    env_file:
      - .env
    environment:
      - DSN=${KRATOS_DSN}
      - LOG_LEVEL=${KRATOS_LOG_LEVEL}
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - ./config:/etc/config/kratos
    networks:
      - intranet

  kratos-migrate:
    image: oryd/kratos:v1.1.0
    env_file:
      - .env
    environment:
      - DSN=postgres://kratos:secret@kratos-postgres:5432/kratos?sslmode=disable
    command: migrate sql -e --yes -c /etc/config/kratos/kratos.yml
    volumes:
      - ./config:/etc/config/kratos
    networks:
      - intranet
    depends_on:
      - kratos-postgres
    restart: on-failure

  hydra:
    image: oryd/hydra:v2.2.0
    ports:
      - "4444:4444"
      - "4445:4445"
      - "5555:5555"
    env_file:
      - .env
    environment:
      - DSN=${HYDRA_DSN}
    command: serve -c /etc/config/hydra/hydra.yml all --dev
    volumes:
      - ./config:/etc/config/hydra
    networks:
      - intranet

  hydra-migrate:
    image: oryd/hydra:v2.2.0
    command: migrate sql -e --yes
    environment:
      - DSN=${HYDRA_DSN}
    networks:
      - intranet
    depends_on:
      - hydra-postgres
    restart: on-failure

  kratos-selfservice-ui-node:
    image: oryd/kratos-selfservice-ui-node:v1.1.0
    ports:
      - "4455:4455"
    env_file:
      - .env
    environment:
      - PORT=4455
      - HYDRA_ADMIN_URL=http://hydra:4445
      - KRATOS_PUBLIC_URL=http://kratos:4433
      - KRATOS_BROWSER_URL=http://127.0.0.1:4433
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME}
      - CSRF_COOKIE_SECRET=${CSRF_COOKIE_SECRET}
      - DANGEROUSLY_DISABLE_SECURE_CSRF_COOKIES=true
    networks:
      - intranet
    restart: on-failure

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DB_URL=${DATABASE_URL}
    networks:
      - intranet

  kratos-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kratos
    ports:
      - "5432:5432"
    networks:
      - intranet
    volumes:
      - kratos-db:/var/lib/postgresql/data

  hydra-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: hydra
    ports:
      - "5433:5432"
    networks:
      - intranet
    volumes:
      - hydra-db:/var/lib/postgresql/data

networks:
  intranet:
    driver: bridge
volumes:
  kratos-db:
  hydra-db:
