version: v1.1.0

serve:
  public:
    base_url: http://127.0.0.1:4433
    cors:
      enabled: true
      allowed_origins:
        - http://127.0.0.1:3000
        - http://localhost:3000
      allowed_methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed_headers:
        - Authorization
        - Content-Type
        - Cookie
      exposed_headers:
        - Content-Type
      allow_credentials: true
  admin:
    base_url: http://127.0.0.1:4434

selfservice:
  default_browser_return_url: http://127.0.0.1:3000/ui/login
  allowed_return_urls:
    - http://127.0.0.1:3000/ui
    - http://127.0.0.1:3000/ui/login
    - http://127.0.0.1:3000/ui/registration
    - http://127.0.0.1:3000/ui/settings
    - http://127.0.0.1:3000/ui/recovery
    - http://127.0.0.1:3000/ui/verification
    - http://127.0.0.1:3000/ui/error
    - http://localhost:3000/ui
    - http://localhost:3000/ui/login
    - http://127.0.0.1:3000/api/v1/auth/login
    - http://127.0.0.1:4433/self-service
    - http://127.0.0.1:4444/oauth2/auth

  methods:
    password:
      enabled: true
      config:
        min_password_length: 6
        identifier_similarity_check_enabled: false
        haveibeenpwned_enabled: false

  flows:
    error:
      ui_url: http://127.0.0.1:3000/ui/error

    settings:
      ui_url: http://127.0.0.1:3000/ui/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    logout:
      after:
        default_browser_return_url: http://127.0.0.1:3000/ui/login

    login:
      ui_url: http://127.0.0.1:3000/ui/login

    registration:
      ui_url: http://127.0.0.1:3000/ui/registration
      after:
        password:
          hooks:
            - hook: session

    recovery:
      ui_url: http://127.0.0.1:3000/ui/recovery

    verification:
      ui_url: http://127.0.0.1:3000/ui/verification

log:
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true

oauth2_provider:
  url: http://hydra:4445
