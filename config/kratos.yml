version: v1.1.0

serve:
  public:
    base_url: https://auth.acmvit.in
    cors:
      enabled: true
      allowed_origins:
        - https://sso.acmvit.in
        - https://auth.acmvit.in
        - https://oauth.acmvit.in
        - https://*.acmvit.in
      allowed_methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed_headers:
        - Authorization
        - Content-Type
        - Cookie
      exposed_headers:
        - Content-Type
      allow_credentials: true
  admin:
    base_url: http://kratos:4434

session:
  cookie:
    domain: .acmvit.in
    same_site: Lax

selfservice:
  default_browser_return_url: https://sso.acmvit.in/ui/login
  allowed_return_urls:
    - https://sso.acmvit.in/ui
    - https://sso.acmvit.in/ui/login
    - https://sso.acmvit.in/ui/registration
    - https://sso.acmvit.in/ui/settings
    - https://sso.acmvit.in/ui/recovery
    - https://sso.acmvit.in/ui/verification
    - https://sso.acmvit.in/ui/error
    - https://sso.acmvit.in/api/v1/auth/login
    - https://auth.acmvit.in/self-service
    - https://oauth.acmvit.in/oauth2/auth
    - https://*.acmvit.in

  methods:
    password:
      enabled: true
      config:
        min_password_length: 6
        identifier_similarity_check_enabled: false
        haveibeenpwned_enabled: false

  flows:
    error:
      ui_url: https://sso.acmvit.in/ui/error

    settings:
      ui_url: https://sso.acmvit.in/ui/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    logout:
      after:
        default_browser_return_url: https://sso.acmvit.in/ui/login

    login:
      ui_url: https://sso.acmvit.in/ui/login

    registration:
      ui_url: https://sso.acmvit.in/ui/registration
      after:
        password:
          hooks:
            - hook: session

    recovery:
      ui_url: https://sso.acmvit.in/ui/recovery

    verification:
      ui_url: https://sso.acmvit.in/ui/verification

log:
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - ${KRATOS_COOKIE_SECRET}
  cipher:
    - ${KRATOS_CIPHER_SECRET}

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true

oauth2_provider:
  url: http://hydra:4445
