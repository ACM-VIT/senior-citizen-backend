serve:
  cookies:
    same_site_mode: Lax
urls:
  self:
    issuer: http://127.0.0.1:4444
  consent: http://127.0.0.1:3000/api/v1/authconsent
  login: http://127.0.0.1:3000/api/v1/auth/login
  logout: http://127.0.0.1:3000/ui/logout
  error: http://127.0.0.1:3000/ui/error
  identity_provider:
    publicUrl: http://127.0.0.1:4433
    url: http://127.0.0.1:4434

secrets:
  system:
    - youReallyNeedToChangeThis

oidc:
  subject_identifiers:
    supported_types:
      - pairwise
      - public
    pairwise:
      salt: youReallyNeedToChangeThis

log:
  leak_sensitive_values: true
  level: debug
