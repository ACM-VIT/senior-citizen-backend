serve:
  cookies:
    same_site_mode: Lax
    domain: .acmvit.in
urls:
  self:
    issuer: https://oauth.acmvit.in
  consent: https://sso.acmvit.in/api/v1/authconsent
  login: https://sso.acmvit.in/api/v1/auth/login
  logout: https://sso.acmvit.in/ui/logout
  error: https://sso.acmvit.in/ui/error
  identity_provider:
    publicUrl: https://auth.acmvit.in
    url: http://kratos:4434

secrets:
  system:
    - ${HYDRA_SYSTEM_SECRET}

oidc:
  subject_identifiers:
    supported_types:
      - pairwise
      - public
    pairwise:
      salt: ${HYDRA_OIDC_SALT}

log:
  leak_sensitive_values: true
  level: debug
